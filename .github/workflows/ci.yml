name: CI

# 每次 push / PR 都在 Windows 上完整验证：格式、Clippy、单元测试、Release 构建。
#
# 2026-10-25 本地实测基线（供排查）：
#   - fmt / clippy(-D warnings) / test(30 项) / release build 全部通过
#   - 冷构建参考：test ~118 s + clippy ~24 s + release ~48 s，timeout 30 分钟足够
#   - vendor/cookie 有 4 条依赖告警，被 cap-lints 限制，不会让本工作流失败
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Windows x64 / Rust 1.99.0
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装固定版本的 Rust 工具链
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          components: rustfmt, clippy

      - name: 缓存 Cargo 注册表与 target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          # target 约 4–6 GB，GitHub 单仓库缓存配额 10 GB；只在 main 上保存，避免 PR 分支打满配额
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: 代码格式检查
        run: cargo fmt --all -- --check

      - name: Clippy（警告即失败）
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: 单元测试
        run: cargo test --locked

      - name: Release 构建
        run: cargo build --release --locked

      - name: 上传 exe 供排查/手动下载
        uses: actions/upload-artifact@v4
        with:
          name: bignumcalc-windows-x64
          path: target/release/bignumcalc.exe
          if-no-files-found: error
          retention-days: 14
