name: Release

# 推送 v* 标签（如 v0.1.0）时自动构建 Windows 便携包并创建 GitHub Release。
# 二进制（exe / zip / WebView2 安装器）只在 Release 附件中出现，不进入 git 历史。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: 构建并发布 Windows 便携包
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装固定版本的 Rust 工具链
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"

      - name: 缓存 Cargo 注册表与 target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: 构建 Release
        run: cargo build --release --locked

      - name: 组装便携包并生成校验和
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag  = "${{ github.ref_name }}"
          if ([string]::IsNullOrWhiteSpace($tag) -or $tag -eq 'main') { $tag = 'dev' }
          $name = "BIGNUM-calculator-$tag-win64"
          $stage = Join-Path $env:RUNNER_TEMP $name

          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item 'target\release\bignumcalc.exe' $stage
          Copy-Item 'README.md', 'LICENSE', 'THIRD_PARTY_NOTICES.md' $stage

          # 官方 WebView2 Evergreen Bootstrapper：仅在目标机缺少运行时时使用。
          # 该引导程序允许随应用一并分发；不要把它提交进 git（已在 .gitignore 中忽略 *.exe）。
          Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' `
            -OutFile (Join-Path $stage 'MicrosoftEdgeWebview2Setup.exe') -UseBasicParsing

          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Set-Content -Encoding ascii "$name.zip.sha256"
          "便携包已生成：$name.zip（$((Get-Item "$name.zip").Length) 字节，SHA256 $hash）"

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            BIGNUM-calculator-*-win64.zip
            BIGNUM-calculator-*-win64.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
